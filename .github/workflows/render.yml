name: render

# DSHA 宣传片 v2 · 渲染管线
# push main → 自动渲审片版（占位也能渲，先证链路通）；
# workflow_dispatch 可选 target=review|master（master 先过 validate-master.mjs 门禁）。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: '渲染目标：review=审片版（DRAFT叠层+占位标注） / master=母版（门禁实跑）'
        required: true
        default: review
        type: choice
        options: [review, master]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22（npm 缓存）
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install edge-tts
        run: pip install -r requirements.txt

      - name: Install CJK fonts + ffmpeg（否则中文豆腐块；ffmpeg 包提供 ffprobe，供 metadata/stills/audit 步骤）
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk ffmpeg

      - name: Generate SFX（程序化音效）
        run: python3 scripts/generate_sfx.py

      - name: Generate voice（edge-tts 旁白；失败重试1次后写静音占位，不阻断审片）
        run: python3 scripts/generate_voice.py

      - name: Prepare assets（logo/二维码/media-manifest；必须在 voice/sfx 之后，manifest 才扫得到产物）
        run: node scripts/prepare-assets.mjs

      - name: Recording audit（录屏禁有声——有音频流只 warning 并列清单）
        run: |
          mkdir -p out/audit
          for f in public/recordings/*.mp4; do
            [ -e "$f" ] || continue
            if ffprobe -v error -select_streams a -show_entries stream=codec_type -of csv=p=0 "$f" | grep -q audio; then
              echo "::warning::录屏含音频流（宣传片要求静音素材）: $f"
              echo "HAS_AUDIO $f" >> out/audit/recording-audio-warnings.txt
            fi
          done
          echo "audit done"

      - name: Ensure headless browser
        run: npx remotion browser ensure

      - name: Type check
        run: npx tsc --noEmit

      - name: Master gate（validate-master.mjs，失败即作业终态）
        if: inputs.target == 'master'
        run: node scripts/validate-master.mjs

      - name: Render
        run: node scripts/render.mjs ${{ inputs.target || 'review' }}

      - name: Collect metadata（ffprobe）
        run: |
          mkdir -p out/stills
          ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels -of json out/*.mp4 > out/ffprobe.json
          echo "--- ffprobe ---"
          cat out/ffprobe.json

      - name: Extract stills（1fps 联系表分两张 5x9，供无本地 ffmpeg 的审片）
        run: |
          mkdir -p out/stills
          ffmpeg -v error -i out/*.mp4 -vf "fps=1,select='between(n,0,44)',scale=320:-1,tile=5x9" -frames:v 1 out/stills/contact-sheet-1.png -y
          ffmpeg -v error -i out/*.mp4 -vf "fps=1,select='between(n,45,89)',scale=320:-1,tile=5x9" -frames:v 1 out/stills/contact-sheet-2.png -y
          echo "stills done"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsha-promo-v2-${{ inputs.target || 'review' }}
          path: |
            out/*.mp4
            out/ffprobe.json
            out/stills/
            out/audit/
          retention-days: 14
          if-no-files-found: error
